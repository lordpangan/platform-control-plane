[defaults]
roles_path = ./roles
inventory = ./inventories/local
# Nicer YAML-formatted task output via the built-in default callback.
# (The old `stdout_callback = yaml` plugin was removed in ansible-core 2.21.)
result_format = yaml
retry_files_enabled = False
host_key_checking = False

# Vault password lives outside the repo
# Relative paths resolve from this file's folder, hence ../../ — see .gitignore *vault-pass*.
vault_password_file = ../../.ansible/platform-vault-pass

[ssh_connection]
pipelining = True
