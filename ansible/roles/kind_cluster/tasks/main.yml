---
# Create the kind cluster if it doesn't already exist (idempotent).

# kind runs on the TARGET host, so the config file must live there — copy it
# from the controller (works for both local and remote connections).
- name: Stage the kind config on the target
  ansible.builtin.copy:
    src: "{{ kind_config_path }}"
    dest: "{{ kind_config_remote }}"
    mode: "0644"

- name: List existing kind clusters
  ansible.builtin.command: kind get clusters
  register: kind_clusters
  changed_when: false

- name: Create the kind cluster
  ansible.builtin.command: >-
    kind create cluster
    --name {{ kind_cluster_name }}
    {{ ('--image ' ~ kind_node_image) if (kind_node_image | default('') | length > 0) else '' }}
    --config {{ kind_config_remote }}
    --wait 120s
  register: kind_create
  changed_when: true
  when: kind_cluster_name not in (kind_clusters.stdout_lines | default([]))

- name: Confirm the cluster API is reachable
  ansible.builtin.command: "kubectl cluster-info --context {{ kube_context }}"
  register: cluster_info
  changed_when: false
  retries: 5
  delay: 5
  until: cluster_info.rc == 0
