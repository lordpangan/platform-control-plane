---
# The Crossplane "engine" provider that runs IaC. We use provider-opentofu
# (OpenTofu, Apache-2.0) rather than provider-terraform, which is frozen at
# Terraform 1.5.x because upstream Terraform moved to the BSL at 1.6.
# Engine-agnostic var names so swapping the engine later is a one-file change.
# Version is pinned in group_vars/all.yml.

engine_provider_name: provider-opentofu
engine_provider_package: "xpkg.upbound.io/upbound/provider-opentofu:{{ provider_opentofu_version }}"

# API group the provider serves (namespaced variant, for Crossplane v2).
engine_api_group: opentofu.m.upbound.io

# Where the provider pod and the AWS creds Secret live (same ns as Crossplane).
provider_namespace: "{{ crossplane_namespace }}"

# AWS credential wiring.
aws_creds_secret_name: aws-creds
cluster_provider_config_name: aws-default
aws_region: ap-southeast-1

# The bootstrap Terraform (Step 1) whose outputs hold the scoped IAM key.
# Read on the CONTROLLER (Mac) via delegate_to: localhost, so it works the same
# whether the cluster is local or on the VM.
bootstrap_state_dir: "{{ playbook_dir }}/../bootstrap/aws-state"
