---
# Local inventory: run everything on THIS machine (your Mac/laptop).
# Tools (docker running + kind/kubectl/helm) are expected to already be present
# — via devbox (`devbox shell`) or brew. No VM, no SSH.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    bootstrap_host: false
